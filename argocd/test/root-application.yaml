apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voyager-test-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/rannelkood3/voyager.git
    targetRevision: main
    path: argocd/test/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
