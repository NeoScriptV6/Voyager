apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter-dsn
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: postgres-exporter-dsn
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATA_SOURCE_NAME: postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:5432/{{ `{{ .database }}` }}?sslmode=disable
  dataFrom:
    - extract:
        key: voyager-rannel/prod/backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voyager-grafana-kubernetes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m]))",
              "legendFormat": "cluster cpu",
              "refId": "A"
            }
          ],
          "title": "Cluster CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{container!=\"\",image!=\"\"})",
              "legendFormat": "cluster memory",
              "refId": "A"
            }
          ],
          "title": "Cluster Memory Usage",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["voyager", "kubernetes"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Voyager Kubernetes Overview",
      "uid": "voyager-k8s-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voyager-grafana-postgres
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  postgres-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {"expr": "pg_up", "refId": "A"}
          ],
          "title": "Postgres Up",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "targets": [
            {"expr": "pg_stat_database_numbackends{datname=\"postgres\"}", "refId": "A"}
          ],
          "title": "Connected Backends",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "targets": [
            {"expr": "pg_database_size_bytes{datname=\"postgres\"}", "refId": "A"}
          ],
          "title": "Database Size",
          "type": "stat"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["voyager", "postgres"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Voyager PostgreSQL Overview",
      "uid": "voyager-postgres-overview",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voyager-grafana-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  app-logs.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 14, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [
            {
              "expr": "{namespace=\"sample-app\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Sample App Logs",
          "type": "logs"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["voyager", "logs"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "Voyager Application Logs",
      "uid": "voyager-app-logs",
      "version": 1
    }
