  <text x="217" y="304" class="edgeText">scrape backend</text>

  <line x1="110" y1="269" x2="110" y2="303" class="edgeThin"/>
  <text x="60" y="292" class="edgeText">HTTP</text>

  <path d="M110 385 L110 352" class="edgeThin"/>
  <text x="62" y="374" class="edgeText">query metrics</text>

  <line x1="110" y1="429" x2="110" y2="463" class="edgeThin"/>
  <text x="59" y="452" class="edgeText">3100</text>

  <path d="M110 545 L110 511" class="edgeThin"/>
  <text x="60" y="532" class="edgeText">3100</text>

  <g>
    <rect x="495" y="225" width="150" height="44" rx="8" class="cicd" stroke-width="0.8"/>
    <text x="570" y="242" class="nodeText" fill="#f5c4b3">GitLab CI</text>
    <text x="570" y="258" class="smallText" fill="#f5c4b3">443 HTTPS</text>
  </g>

  <g>
    <rect x="495" y="305" width="150" height="44" rx="8" class="cicd" stroke-width="0.8"/>
    <text x="570" y="322" class="nodeText" fill="#f5c4b3">ECR registry</text>
    <text x="570" y="338" class="smallText" fill="#f5c4b3">push images</text>
  </g>

  <g>
    <rect x="495" y="385" width="150" height="44" rx="8" class="cicd" stroke-width="0.8"/>
    <text x="570" y="402" class="nodeText" fill="#f5c4b3">ArgoCD</text>
    <text x="570" y="418" class="smallText" fill="#f5c4b3">sync / deploy</text>
  </g>

