  <line x1="340" y1="193" x2="340" y2="223" class="edge"/>
  <text x="389" y="212" class="edgeText">forward traffic</text>

  <line x1="340" y1="269" x2="340" y2="303" class="edge"/>
  <text x="390" y="292" class="edgeText">API calls</text>

  <line x1="340" y1="349" x2="340" y2="383" class="edge"/>
  <text x="395" y="372" class="edgeText">ingress routes</text>

  <line x1="340" y1="429" x2="340" y2="463" class="edge"/>
  <text x="395" y="452" class="edgeText">read/write data</text>

