    <text x="340" y="657" class="nodeText" fill="#d3d1c7">AWS Secrets Manager</text>
    <text x="340" y="673" class="smallText" fill="#d3d1c7">DB/JWT/app secrets</text>
  </g>

  <g>
    <rect x="35" y="640" width="150" height="44" rx="8" class="infra" stroke-width="0.8"/>
    <text x="110" y="657" class="nodeText" fill="#d3d1c7">External DNS</text>
    <text x="110" y="673" class="smallText" fill="#d3d1c7">Route53 API / 443</text>
  </g>

  <g>
    <rect x="495" y="640" width="150" height="44" rx="8" class="admin" stroke-width="0.8"/>
    <text x="570" y="657" class="nodeText" fill="#d4d4d8">Dev / Admin</text>
    <text x="570" y="673" class="smallText" fill="#d4d4d8">VPN / bastion / 443</text>
  </g>

  <path d="M340 509 L340 573" class="edgeThin"/>
  <text x="403" y="548" class="edgeText">secrets injected</text>

  <line x1="340" y1="619" x2="340" y2="638" class="edgeThin"/>
  <text x="386" y="634" class="edgeText">fetch</text>

  <path d="M185 662 C220 662 220 597 248 597" class="edgeThin"/>
