<svg width="100%" viewBox="0 0 680 760" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Cloud Cartographer</title>
  <desc>Infrastructure Network Port Map</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <style>
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #faf9f5; }
      .subtitle { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c2c0b6; }
      .nodeText { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
      .smallText { font: 400 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
      .edgeText { font: 400 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c2c0b6; text-anchor: middle; }
      .legend { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c2c0b6; }
      .edge { fill: none; stroke: #9c9a92; stroke-width: 1.45; marker-end: url(#arrow); }
      .edgeThin { fill: none; stroke: #79776f; stroke-width: 1.1; marker-end: url(#arrow); }
      .user { fill: #444441; stroke: #b4b2a9; }
      .app { fill: #3c3489; stroke: #afa9ec; }
      .backend { fill: #4c378f; stroke: #b8adf0; }
      .data { fill: #085041; stroke: #5dcaa5; }
      .monitor { fill: #633806; stroke: #ef9f27; }
      .cicd { fill: #712b13; stroke: #f0997b; }
      .cluster { fill: #0c447c; stroke: #85b7eb; }
      .infra { fill: #444441; stroke: #b4b2a9; }
      .admin { fill: #3f3f46; stroke: #a1a1aa; }
    </style>
  </defs>


  <text x="340" y="24" text-anchor="middle" class="title">Cloud Cartographer</text>
  <text x="340" y="42" text-anchor="middle" class="subtitle">Infrastructure Network Port Map</text>

  <g>
    <rect x="280" y="65" width="120" height="44" rx="8" class="user" stroke-width="0.8"/>
    <text x="340" y="82" class="nodeText" fill="#d3d1c7">User browser</text>
    <text x="340" y="98" class="smallText" fill="#b9b7ae">public client</text>
  </g>

  <g>
    <rect x="250" y="145" width="180" height="48" rx="8" class="cluster" stroke-width="0.8"/>
    <text x="340" y="162" class="nodeText" fill="#b5d4f4">Public LB / Ingress</text>
    <text x="340" y="179" class="smallText" fill="#b5d4f4">443 HTTPS / 80 HTTP</text>
  </g>

  <g>
    <rect x="270" y="225" width="140" height="44" rx="8" class="app" stroke-width="0.8"/>
    <text x="340" y="242" class="nodeText" fill="#cecbf6">Frontend pods</text>
    <text x="340" y="258" class="smallText" fill="#cecbf6">3000 HTTP</text>
  </g>

  <g>
    <rect x="270" y="305" width="140" height="44" rx="8" class="backend" stroke-width="0.8"/>
    <text x="340" y="322" class="nodeText" fill="#d8d2fa">Backend ingress</text>
    <text x="340" y="338" class="smallText" fill="#d8d2fa">443 HTTPS</text>
  </g>

  <g>
    <rect x="270" y="385" width="140" height="44" rx="8" class="backend" stroke-width="0.8"/>
