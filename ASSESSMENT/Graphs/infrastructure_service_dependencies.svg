  <text x="622" y="292" class="edgeText">push</text>

  <path d="M570 269 C650 300 650 365 570 383" class="edgeThin"/>
  <text x="633" y="337" class="edgeText">trigger</text>

  <line x1="570" y1="429" x2="570" y2="463" class="edgeThin"/>
  <text x="620" y="452" class="edgeText">pull</text>

  <line x1="570" y1="509" x2="570" y2="543" class="edgeThin"/>
  <text x="620" y="532" class="edgeText">apply</text>

  <path d="M495 565 C455 545 438 505 420 487" class="edgeThin"/>
