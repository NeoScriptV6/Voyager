  <path d="M570 640 L570 591" class="edgeThin"/>
  <text x="620" y="621" class="edgeText">kubectl</text>

  <rect x="45" y="720" width="10" height="10" rx="2" class="app"/><text x="62" y="729" class="legend">App</text>
  <rect x="115" y="720" width="10" height="10" rx="2" class="data"/><text x="132" y="729" class="legend">Data/logs</text>
  <rect x="220" y="720" width="10" height="10" rx="2" class="monitor"/><text x="237" y="729" class="legend">Observability</text>
  <rect x="350" y="720" width="10" height="10" rx="2" class="cicd"/><text x="367" y="729" class="legend">CI/CD &amp; GitOps</text>
  <rect x="490" y="720" width="10" height="10" rx="2" class="cluster"/><text x="507" y="729" class="legend">Cluster/API</text>
  <rect x="590" y="720" width="10" height="10" rx="2" class="infra"/><text x="607" y="729" class="legend">Infrastructure</text>
</svg>
