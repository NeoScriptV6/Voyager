    <text x="110" y="258" class="smallText" fill="#fac775">scrapes metrics</text>
  </g>

  <g>
    <rect x="35" y="305" width="150" height="44" rx="8" class="monitor" stroke-width="0.8"/>
    <text x="110" y="322" class="nodeText" fill="#fac775">Metrics endpoints</text>
    <text x="110" y="338" class="smallText" fill="#fac775">8080 / 9187 / 9100</text>
  </g>

  <g>
    <rect x="35" y="385" width="150" height="44" rx="8" class="monitor" stroke-width="0.8"/>
    <text x="110" y="402" class="nodeText" fill="#fac775">Grafana</text>
    <text x="110" y="418" class="smallText" fill="#fac775">dashboards</text>
  </g>

  <g>
    <rect x="35" y="465" width="150" height="44" rx="8" class="data" stroke-width="0.8"/>
    <text x="110" y="482" class="nodeText" fill="#9fe1cb">Loki</text>
    <text x="110" y="498" class="smallText" fill="#9fe1cb">3100 HTTP</text>
  </g>

  <g>
    <rect x="35" y="545" width="150" height="44" rx="8" class="monitor" stroke-width="0.8"/>
    <text x="110" y="562" class="nodeText" fill="#fac775">Promtail / Alloy</text>
    <text x="110" y="578" class="smallText" fill="#fac775">pushes logs</text>
  </g>

